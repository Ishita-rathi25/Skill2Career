<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill2Career</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        .splash {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        .logo {
            width: 280px;
            max-width: 65%;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <div class="splash">
        <img src="skill2career.jpg" alt="Skill2Career Logo" class="logo">
    </div>

    <script>
        setTimeout(function () {
            window.location.href = "login.html";
        }, 2500);
    </script>

</body>
</html>
