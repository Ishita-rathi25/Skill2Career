<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill2Career - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: white;
            padding: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Skip Button */
        .skip-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            text-decoration: none;
            color: #6c4cff;
            font-size: 15px;
            font-weight: 600;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 130px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #6c4cff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c4cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #5738e8;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .signup a {
            color: #6c4cff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Skip -->
        <a href="home.html" class="skip-btn">Skip</a>

        <!-- Logo -->
        <div class="logo">
            <img src="skill2career.jpg" alt="Skill2Career">
        </div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to continue your career journey</p>

        <form>

            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

</body>
</html>
